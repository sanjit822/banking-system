<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bank Deposit</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      transition: background 0.3s, color 0.3s;
    }
    header {
      background: navy;
      color: white;
      padding: 15px;
      text-align: center;
    }
    header img {
      height: 50px;
      vertical-align: middle;
      margin-right: 10px;
    }
    nav {
      background-color: #f2f2f2;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
      padding: 10px;
    }
    nav a {
      text-decoration: none;
      color: navy;
      font-weight: bold;
    }
    #carousel {
      position: relative;
      height: 250px;
      overflow: hidden;
    }
    #carousel img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      display: none;
    }
    #carousel img.active {
      display: block;
    }
    .container {
      padding: 20px;
      text-align: center;
    }
    form {
      max-width: 600px;
      margin: 0 auto;
      background: #f9f9f9;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    input, select, textarea {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      margin-top: 10px;
      padding: 12px 25px;
      background-color: navy;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background-color: darkblue;
    }
    .dark-mode {
      background: #121212;
      color: white;
    }
    .dark-mode form {
      background: #1e1e1e;
      color: white;
    }
    .status-message {
      font-weight: bold;
      margin-top: 10px;
    }
    .success { color: green; }
    .error { color: red; }
    .info-box {
      text-align: left;
      margin-top: 20px;
      padding: 10px;
      background: #f0f8ff;
      border-left: 4px solid navy;
      border-radius: 6px;
    }
    .timestamp {
      font-size: 0.9em;
      color: gray;
    }
    @media screen and (max-width: 600px) {
      nav {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>

  <header>
    <img src="static/images/logo.png" alt="Bank Logo" />
    <span id="welcome">Welcome to the Deposit Portal</span>
  </header>

  <nav>
    <a href="/">Home</a>
    <a href="/about">About</a>
    <a href="/admin">Admin</a>
    <a href="/client">Client</a>
    <a href="/complaint">Complaint</a>
    <a href="/deposit">Deposit</a>
    <a href="/history">History</a>
    <a href="/login">Login</a>
    <a href="/services">Services</a>
    <a href="/withdraw">Withdraw</a>
    <a href="/contact">Contact</a>
  </nav>

  <div id="carousel">
    <img src="static/images/deposit1.png" class="active" />
    <img src="static/images/deposit2.png" class="active"/>
    <img src="static/images/deposit3.png" class="active"/>
  </div>

  <div class="container">
    <button onclick="toggleDarkMode()">🌙 Toggle Dark Mode</button>
    <form id="depositForm">
      <h2>Make a Deposit</h2>
      <input type="text" name="account" id="account" placeholder="Account Number" maxlength="12" pattern="\\d{6,12}" title="6-12 digit number" required />
      <input type="number" name="amount" id="amount" placeholder="Amount (₹)" min="1" required />
      <select name="method" id="method" required>
        <option value="">Select Deposit Method</option>
        <option value="cash">Cash</option>
        <option value="cheque">Cheque</option>
        <option value="online">Online Transfer</option>
      </select>
      <textarea name="remarks" id="remarks" rows="3" placeholder="Remarks (optional)"></textarea>
      <div class="timestamp" id="timestamp"></div>
      <button type="submit">Submit Deposit</button>
      <p id="message" class="status-message"></p>
    </form>

    <div class="info-box" id="previewBox" style="display: none;">
      <h4>Deposit Preview:</h4>
      <p><strong>Account:</strong> <span id="previewAccount"></span></p>
      <p><strong>Amount:</strong> ₹<span id="previewAmount"></span></p>
      <p><strong>Method:</strong> <span id="previewMethod"></span></p>
      <p><strong>Remarks:</strong> <span id="previewRemarks"></span></p>
    </div>
  </div>

  <script>
    let index = 0;
    const images = document.querySelectorAll('#carousel img');

    function showNextImage() {
      images[index].classList.remove('active');
      index = (index + 1) % images.length;
      images[index].classList.add('active');
    }
    setInterval(showNextImage, 3000);

    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
    }

    const welcome = document.getElementById('welcome');
    const welcomeText = welcome.textContent;
    welcome.textContent = '';
    let i = 0;
    function typeWelcome() {
      if (i < welcomeText.length) {
        welcome.innerHTML += welcomeText[i++];
        setTimeout(typeWelcome, 50);
      }
    }
    typeWelcome();

    document.getElementById('depositForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const account = this.account.value.trim();
      const amount = this.amount.value.trim();
      const method = this.method.value;
      const remarks = this.remarks.value.trim();
      const message = document.getElementById('message');
      const previewBox = document.getElementById('previewBox');

      if (!account || !amount || !method) {
        message.textContent = "❌ Please fill all required fields!";
        message.className = "status-message error";
        return;
      }

      // Live preview
      document.getElementById('previewAccount').innerText = account;
      document.getElementById('previewAmount').innerText = amount;
      document.getElementById('previewMethod').innerText = method;
      document.getElementById('previewRemarks').innerText = remarks || "None";
      previewBox.style.display = "block";

      // Simulate Backend POST
      fetch("/api/deposit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ account, amount, method, remarks })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          message.textContent = "✅ Deposit successful!";
          message.className = "status-message success";
          document.getElementById('depositForm').reset();
        } else {
          message.textContent = "❌ " + data.error;
          message.className = "status-message error";
        }
      })
      .catch(() => {
        message.textContent = "⚠️ Server error. Try again later.";
        message.className = "status-message error";
      });
    });

    // Show timestamp
    document.getElementById('timestamp').innerText = "🕒 " + new Date().toLocaleString();

    // Alert on load
    window.onload = () => {
      setTimeout(() => alert("🔔 You are now on the Deposit page."), 1000);
    };
  </script>
</body>
</html>
