<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard - SecureBank</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      transition: background 0.3s, color 0.3s;
    }
    header {
      background: navy;
      color: white;
      padding: 15px;
      text-align: center;
    }
    nav {
      background: #f4f4f4;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      padding: 10px;
    }
    nav a {
      text-decoration: none;
      color: navy;
      font-weight: bold;
      padding: 8px 12px;
    }
    nav a:hover {
      background: navy;
      color: white;
      border-radius: 5px;
    }
    #carousel {
      position: relative;
      width: 100%;
      height: 250px;
      overflow: hidden;
    }
    #carousel img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      display: none;
    }
    #carousel img.active {
      display: block;
    }
    section {
      padding: 20px;
      text-align: center;
    }
    .dashboard {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      max-width: 1100px;
      margin: auto;
    }
    .card {
      background: #f0f0f0;
      border-radius: 12px;
      padding: 20px;
      width: 220px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
      transition: background 0.3s;
    }
    .card h3 {
      margin-bottom: 10px;
    }
    .card p {
      font-size: 22px;
      font-weight: bold;
    }
    .dark-mode {
      background: #121212;
      color: white;
    }
    .dark-mode .card {
      background: #2e2e2e;
    }
    button {
      padding: 10px 18px;
      background-color: navy;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin: 5px;
    }
    .admin-actions {
      margin-top: 30px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }
    .admin-actions button {
      background: #0a4a6b;
    }
    .search-bar {
      margin: 20px auto;
      max-width: 500px;
    }
    .search-bar input {
      width: 100%;
      padding: 10px;
      border: 2px solid #ccc;
      border-radius: 6px;
    }
    @media (max-width: 600px) {
      nav {
        flex-direction: column;
        align-items: center;
      }
      .dashboard {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>

<header>
  <h1 id="welcome">Welcome to Admin Dashboard</h1>
</header>

<nav>
  <a href="/">Home</a>
  <a href="/about">About</a>
  <a href="/admin">Admin</a>
  <a href="/client">Client</a>
  <a href="/deposit">Deposit</a>
  <a href="/withdraw">Withdraw</a>
  <a href="/history">History</a>
  <a href="/services">Services</a>
  <a href="/contact">Contact</a>
  <a href="/logout">Logout</a>
</nav>

<div id="carousel">
  <img src="static/images/admin1.png" class="active" alt="Admin Image 1">
  <img src="static/images/admin2.png" class="active" alt="Admin Image 2">
  <img src="static/images/admin3.png" class="active" alt="Admin Image 3">
</div>

<section>
  <div class="search-bar">
    <input type="text" placeholder="Search user, transaction ID, or complaint..." oninput="searchFeature(this.value)">
  </div>

  <h2>Dashboard Statistics</h2>
  <div class="dashboard">
    <div class="card"><h3>Total Users</h3><p id="userCount">0</p></div>
    <div class="card"><h3>Transactions</h3><p id="transactionCount">0</p></div>
    <div class="card"><h3>Pending Complaints</h3><p id="complaintCount">0</p></div>
    <div class="card"><h3>Blocked Users</h3><p id="blockedCount">0</p></div>
    <div class="card"><h3>Services</h3><p id="serviceCount">0</p></div>
  </div>

  <div class="admin-actions">
    <button onclick="manageUsers()">👤 Manage Users</button>
    <button onclick="blockUsers()">🚫 Block/Unblock Users</button>
    <button onclick="viewAccounts()">🏦 View All Accounts</button>
    <button onclick="viewTransactions()">📑 View Transactions</button>
    <button onclick="viewComplaints()">📨 Complaints</button>
    <button onclick="manageServices()">🛠️ Manage Services</button>
    <button onclick="generateReports()">📊 Generate Reports</button>
    <button onclick="toggleDarkMode()">🌓 Toggle Dark Mode</button>
  </div>
</section>

<script>
  const images = document.querySelectorAll('#carousel img');
  let currentIndex = 0;

  function showNextImage() {
    images[currentIndex].classList.remove('active');
    currentIndex = (currentIndex + 1) % images.length;
    images[currentIndex].classList.add('active');
  }
  setInterval(showNextImage, 3000);

  function toggleDarkMode() {
    document.body.classList.toggle('dark-mode');
  }

  const welcome = document.getElementById('welcome');
  const welcomeText = welcome.textContent;
  let i = 0;
  function typeWelcome() {
    if (i < welcomeText.length) {
      welcome.innerHTML = welcomeText.slice(0, i + 1);
      i++;
      setTimeout(typeWelcome, 80);
    }
  }
  welcome.innerHTML = '';
  typeWelcome();

  window.onload = () => {
    setTimeout(() => {
      alert("🔔 You are now on the Admin Dashboard.");
    }, 1000);
    // Simulated counts
    document.getElementById('userCount').innerText = 354;
    document.getElementById('transactionCount').innerText = 1248;
    document.getElementById('complaintCount').innerText = 6;
    document.getElementById('blockedCount').innerText = 12;
    document.getElementById('serviceCount').innerText = 8;
  };

  function manageUsers() {
    alert("Opening Manage Users Panel...");
    // location.href = "/admin/users";
  }
  function blockUsers() {
    alert("Redirecting to User Block/Unblock...");
    // location.href = "/admin/block-users";
  }
  function viewAccounts() {
    alert("Loading All Bank Accounts...");
    // location.href = "/admin/accounts";
  }
  function viewTransactions() {
    alert("Fetching Transaction Logs...");
    // location.href = "/admin/transactions";
  }
  function viewComplaints() {
    alert("Opening Complaints Section...");
    // location.href = "/admin/complaints";
  }
  function manageServices() {
    alert("Managing Bank Services...");
    // location.href = "/admin/services";
  }
  function generateReports() {
    alert("Generating PDF Reports...");
    // window.location = "/admin/report-pdf";
  }

  function searchFeature(query) {
    if (query.length > 2) {
      console.log("Searching:", query);
      // Trigger backend search if connected
    }
  }
</script>

</body>
</html>
