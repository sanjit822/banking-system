<!DOCTYPE html>
<html>
<head>
  <title>Complaint - Bank</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial;
      margin: 0;
      padding: 0;
      transition: background 0.3s, color 0.3s;
    }
    header {
      background: navy;
      color: white;
      padding: 10px;
      text-align: center;
    }
    nav {
      background-color: #f2f2f2;
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 10px;
      flex-wrap: wrap;
    }
    nav a {
      text-decoration: none;
      color: navy;
      font-weight: bold;
    }
    #carousel {
      position: relative;
      width: 100%;
      height: 250px;
      overflow: hidden;
    }
    #carousel img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      display: none;
    }
    #carousel img.active {
      display: block;
    }
    section {
      padding: 20px;
      text-align: center;
    }
    .dark-mode {
      background: #121212;
      color: white;
    }
    button {
      margin-top: 10px;
      padding: 8px 16px;
      background-color: navy;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }
    form {
      max-width: 600px;
      margin: 20px auto;
      background: #f9f9f9;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    .dark-mode form {
      background: #1e1e1e;
    }
    .message {
      margin-top: 15px;
      font-weight: bold;
    }
    .char-count {
      text-align: right;
      font-size: 12px;
      color: gray;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      max-width: 400px;
    }
    .dark-mode .modal-content {
      background: #222;
      color: white;
    }
    @media screen and (max-width: 600px) {
      nav {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>

<header>
  <h1 id="welcome">Welcome to Complaint Page</h1>
</header>

<nav>
  <a href="/">Home</a>
  <a href="/about">About</a>
  <a href="/admin">Admin</a>
  <a href="/client">Client</a>
  <a href="/complaint">Complaint</a>
  <a href="/deposit">Deposit</a>
  <a href="/history">History</a>
  <a href="/login">Login</a>
  <a href="/services">Services</a>
  <a href="/withdraw">Withdraw</a>
  <a href="/contact">Contact</a>
</nav>

<!-- Image Carousel -->
<div id="carousel">
  <img src="static/images/complaint1.png" class="active" alt="Image 1">
  <img src="static/images/complaint2.png" class="active" alt="Image 2">
  <img src="static/images/complaint3.png" class="active" alt="Image 3">
</div>

<section>
  <p>Please submit your complaint below. Our team will get back to you shortly.</p>
  <button onclick="toggleDarkMode()">Toggle Dark Mode</button>

  <form id="complaintForm">
    <input type="text" id="complaintId" readonly placeholder="Complaint ID (Auto-generated)">
    <input type="text" id="name" placeholder="Your Name" required>
    <input type="email" id="email" placeholder="Your Email" required>
    <input type="tel" id="phone" placeholder="Your Phone Number" required>
    <input type="date" id="date" required>
    <select id="priority" required>
      <option value="">Select Priority</option>
      <option>Low</option>
      <option>Medium</option>
      <option>High</option>
    </select>
    <select id="category" required>
      <option value="">Select Complaint Category</option>
      <option>Transaction Issue</option>
      <option>Login Problem</option>
      <option>Unauthorized Access</option>
      <option>Card Issue</option>
      <option>Other</option>
    </select>
    <select id="status" required>
      <option>New</option>
      <option>In Progress</option>
      <option>Resolved</option>
    </select>
    <textarea id="message" rows="5" placeholder="Describe your issue..." required></textarea>
    <div class="char-count" id="charCount">0/500</div>
    <input type="file" id="attachment" accept=".jpg,.png,.pdf,.doc,.docx">
    <button type="button" onclick="showModal()">Submit Complaint</button>
    <p class="message" id="responseMsg"></p>
  </form>
</section>

<!-- Modal -->
<div id="modal" class="modal">
  <div class="modal-content">
    <h3>Confirm Submission</h3>
    <p>Are you sure you want to submit this complaint?</p>
    <button onclick="submitComplaint()">Yes, Submit</button>
    <button onclick="closeModal()">Cancel</button>
  </div>
</div>

<script>
  let index = 0;
  const images = document.querySelectorAll('#carousel img');
  function showNextImage() {
    images[index].classList.remove('active');
    index = (index + 1) % images.length;
    images[index].classList.add('active');
  }
  setInterval(showNextImage, 3000);

  function toggleDarkMode() {
    document.body.classList.toggle('dark-mode');
  }

  const welcome = document.getElementById('welcome');
  let welcomeText = welcome.textContent;
  let i = 0;
  function typeWelcome() {
    if (i < welcomeText.length) {
      welcome.innerHTML = welcomeText.slice(0, i + 1);
      i++;
      setTimeout(typeWelcome, 80);
    }
  }
  welcome.innerHTML = '';
  typeWelcome();

  window.onload = () => {
    document.getElementById('complaintId').value = 'CMP' + Date.now();
    setTimeout(() => {
      alert("🔔 You are now viewing the Complaint page!");
    }, 1000);
  };

  document.getElementById('message').addEventListener('input', function () {
    document.getElementById('charCount').textContent = `${this.value.length}/500`;
  });

  function showModal() {
    document.getElementById('modal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('modal').style.display = 'none';
  }

  function submitComplaint() {
    closeModal();
    const form = document.getElementById('complaintForm');
    document.getElementById('responseMsg').textContent =
      "✅ Complaint submitted successfully at " + new Date().toLocaleTimeString();
    form.reset();
    document.getElementById('complaintId').value = 'CMP' + Date.now();
    document.getElementById('charCount').textContent = "0/500";
  }
</script>

</body>
</html>
